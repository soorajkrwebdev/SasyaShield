<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>SmartFarm 2.0 - Digital Farm Management & Sustainable Agriculture Intelligence Platform</title>
    <meta name="description" content="A modern, responsive platform for farmers to manage farms, crops, sustainable practices, IPM pest management, weather and farm intelligence." />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%2316a34a'><path d='M12 2L10 6.5C7.5 12 4 14 4 18c0 3.3 2.7 6 6 6s6-2.7 6-6c0-4-3.5-6-6-11.5L12 2z'/></svg>" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <script>
      // Dark-mode option removed: always run the light theme and clear any saved choice.
      try {
        localStorage.removeItem('smartfarm-theme');
        document.documentElement.classList.remove('dark');
        document.documentElement.dataset.theme = 'light';
        document.documentElement.style.colorScheme = 'light';
      } catch (e) { /* ignore */ }
    </script>
  </head>
  <body class="bg-slate-50 text-slate-800 antialiased selection:bg-emerald-200 selection:text-emerald-900 min-h-screen dark:bg-slate-950 dark:text-slate-100">
    <div id="root" class="min-h-screen flex flex-col"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
